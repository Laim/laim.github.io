---
layout: global
---
<section class="pb-5 hero-bg">
    <div class="row align-items-center g-5">
        <div class="col-md-7">
            <h1 class="fw-bold display-5 mb-3">
                <span class="text-accent">Projects</span>
            </h1>

            <p class="mb-4">
                {{ page.intro }}
            </p>
        </div>

    </div>
</section>


<section id="main-content" class="container-custom py-5">
    <div class="row g-4">
        {% assign sortedprojects = site.projects | sort: "initial-release" | reverse %}
        {% for project in sortedprojects %} 
        <div class="col-md-6 col-lg-4">
            <a href="{{ site.url }}{{ project.url }}" class="mckl-card-link">
                <div class="card border-0 h-100 project-card">
                        <div class="p-4">
                            <h5 class="fw-semibold mb-3">
                                {{ project.title }}
                            </h5>

                            <p class="text-muted small mb-4">
                                {{ project.description | strip_html | truncate: 140 }}
                            </p>

                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <span class="pill">{{ project.language }}</span>
                            </div>
                        </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</section>
